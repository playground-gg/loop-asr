# Arm B: Inkling-style prelude 1 + shared core 2 x K + coda 1; blocks run per frame = 2 + 2K
# (14 at k=6, the mean and mode of the K distribution and the point arm C matches; 22 at
# K_max=10). DECISIONS.md decisions 2 and 4.
# PLACEHOLDER: shapes and param target from docs/plan.md; training values are the plan's
# defaults and get fixed (and written down) after the step-0 calibration, before any run.
name: arm_b
arm: B
target_params: 3.61e6  # counted: 3,608,513 = A + 33,792 gate params (+0.95%)

model:
  kind: looped
  n_mels: 80
  d_model: 256
  n_heads: 4
  d_ff: 1024
  dropout: 0.1
  conv_channels: 64
  vocab_size: 256   # sentencepiece BPE; CTC blank is index 256
  n_prelude: 1
  n_core: 2         # shared, run K times
  n_coda: 1
  gate_rank: 32     # one low-rank message gate per core layer, up-projection zero-init (closed)
  default_loops: 10 # K_max (DECISIONS.md 2026-11-23 a); used when the caller passes no loop count

train:  # identical across arms (plan.md section 4)
  data: librispeech/train-clean-100
  epochs: 15            # pilot; full run 50
  optimizer: adamw
  lr_peak: 7.0e-4
  warmup_steps: 1000
  schedule: cosine
  seed: 0
  spec_augment: light
  loops_sample: [2, 4, 6, 8, 10]   # K sampled per step, K_max=10 (DECISIONS.md 2026-11-23 a)
  loops_weights: [1, 2, 6, 2, 1]   # mean = mode = 6 -> C has 14 blocks (decision 4)
  # Equal LR sweep for every arm (DECISIONS.md decision 3): one run per value at HALF the
  # steps; the winner is rerun at full steps as configs/arm_<x>_best.yaml.
  lr_sweep: [3.0e-4, 7.0e-4, 1.5e-3]
  lr_sweep_steps_fraction: 0.5

eval:
  splits: [dev-clean, dev-other]   # pilot: dev WER only; test-* and int8 once, only after a go (DECISIONS.md 2026-11-23 c)
  decode: ctc_greedy
  loops: [1, 2, 4, 6, 8, 10, 12, 14, 16]   # 12-16: extrapolation past K_max
